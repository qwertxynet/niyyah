<!doctype html>
<html data-size="1280x600">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .canvas {
        width: 1280px;
        height: 600px;
        background: linear-gradient(90deg, #2b2a5c 0%, #3d78a8 26%, #c98f3a 52%, #8d4062 76%, #0d1230 100%);
      }
      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(8, 8, 24, 0.15), rgba(8, 8, 24, 0.55));
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
        top: 54px;
        display: flex;
        justify-content: center;
        gap: 26px;
      }
      figure {
        width: 220px;
      }
      .phone {
        padding: 7px;
        border-radius: 38px;
      }
      .crop {
        height: 400px;
        border-radius: 31px;
      }
      .crop img {
        width: 100%;
        height: 100%;
      }
      figcaption {
        margin-top: 22px;
        text-align: center;
        color: #fff8ee;
      }
      figcaption b {
        display: block;
        font-family: 'Fraunces', serif;
        font-weight: 600;
        font-size: 30px;
        font-variation-settings: 'opsz' 72;
      }
      figcaption span {
        display: block;
        margin-top: 4px;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 248, 238, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="pattern"></div>
      <div class="veil"></div>
      <div class="row">
        <figure>
          <div class="phone"><div class="crop"><img src="../../.cache/readme/shot-today-fajr.png" alt="" /></div></div>
          <figcaption><b>Fajr</b><span>Indigo dawn</span></figcaption>
        </figure>
        <figure>
          <div class="phone"><div class="crop"><img src="../../.cache/readme/shot-today-dhuhr.png" alt="" /></div></div>
          <figcaption><b>Dhuhr</b><span>Clear midday</span></figcaption>
        </figure>
        <figure>
          <div class="phone"><div class="crop"><img src="../../.cache/readme/shot-today-asr.png" alt="" /></div></div>
          <figcaption><b>Asr</b><span>Honey gold</span></figcaption>
        </figure>
        <figure>
          <div class="phone"><div class="crop"><img src="../../.cache/readme/shot-today-maghrib.png" alt="" /></div></div>
          <figcaption><b>Maghrib</b><span>Sunset violet</span></figcaption>
        </figure>
        <figure>
          <div class="phone"><div class="crop"><img src="../../.cache/readme/shot-today-night.png" alt="" /></div></div>
          <figcaption><b>Night</b><span>Starlit navy</span></figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
